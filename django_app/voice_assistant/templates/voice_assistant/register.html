<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إنشاء حساب جديد | مساعد Gemini Live</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">
  <div class="w-full max-w-md bg-slate-900/80 border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-xl">
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-600 via-teal-600 to-indigo-600 mx-auto flex items-center justify-center shadow-lg shadow-teal-500/20 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-indigo-400 bg-clip-text text-transparent">
        إنشاء حساب جديد
      </h1>
      <p class="text-sm text-slate-400 mt-2">
        انضم وابدأ محادثتك مع المساعد الصوتي فورا
      </p>
    </div>

    {% if error %}
    <div class="mb-6 p-4 rounded-xl bg-red-950/60 border border-red-800/80 text-red-300 text-sm flex items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0 text-red-400" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
      </svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="" class="space-y-4">
      {% csrf_token %}

      <div>
        <label for="username" class="block text-sm font-medium text-slate-300 mb-2">اسم المستخدم</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          required 
          autocomplete="username"
          class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition"
          placeholder="اختر اسم مستخدم"
        />
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-slate-300 mb-2">البريد الإلكتروني (اختياري)</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          autocomplete="email"
          class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition"
          placeholder="name@example.com"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-300 mb-2">كلمة المرور</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          autocomplete="new-password"
          class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition"
          placeholder="6 أحرف على الأقل"
        />
      </div>

      <div>
        <label for="password_confirm" class="block text-sm font-medium text-slate-300 mb-2">تأكيد كلمة المرور</label>
        <input 
          type="password" 
          id="password_confirm" 
          name="password_confirm" 
          required 
          autocomplete="new-password"
          class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition"
          placeholder="أعد إدخال كلمة المرور"
        />
      </div>

      <button 
        type="submit" 
        class="w-full mt-2 py-3.5 px-4 rounded-xl font-semibold bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white shadow-lg shadow-teal-600/30 transition transform active:scale-98"
      >
        إنشاء الحساب وبدء الاستخدام
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-800 text-center text-sm text-slate-400">
      لديك حساب بالفعل؟
      <a href="{% url 'voice_assistant:login' %}" class="text-teal-400 hover:text-teal-300 font-medium mr-1 transition underline">
        تسجيل الدخول
      </a>
    </div>
  </div>
</body>
</html>
