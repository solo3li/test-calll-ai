services:
  traefik:
    build:
      context: ./traefik
      dockerfile: Dockerfile
    container_name: voice_traefik
    restart: unless-stopped
    ports:
      - "8080:80"
      - "443:443"
    networks:
      - voice_net

  livekit:
    build:
      context: ./livekit
      dockerfile: Dockerfile
    container_name: voice_livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml --node-ip ${EXTERNAL_IP:-127.0.0.1}
    environment:
      - LIVEKIT_RTC_NODE_IP=${EXTERNAL_IP:-127.0.0.1}
    ports:
      - "50000-50020:50000-50020/udp"
      - "7881:7881"
      - "7882:7882/udp"
    depends_on:
      - redis
    networks:
      - voice_net

  redis:
    image: redis:7-alpine
    container_name: voice_redis
    restart: unless-stopped
    networks:
      - voice_net

  centrifugo:
    build:
      context: ./centrifugo
      dockerfile: Dockerfile
    container_name: voice_centrifugo
    restart: unless-stopped
    command: centrifugo -c /centrifugo/config.json
    depends_on:
      - redis
    networks:
      - voice_net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: voice_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voice_db}
      POSTGRES_USER: ${POSTGRES_USER:-voice_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voice_password_123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - voice_net

  django:
    build:
      context: ./django_app
      dockerfile: Dockerfile
    container_name: voice_django
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - media_data:/app/media
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - centrifugo
      - livekit
    networks:
      - voice_net

  mock_store:
    build:
      context: ./mock_store
      dockerfile: Dockerfile
    container_name: voice_mock_store
    restart: unless-stopped
    ports:
      - "8001:8000"
      - "8002:8002"
    networks:
      voice_net:
        aliases:
          - mock-store
          - mockstore

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: voice_agent
    restart: unless-stopped
    volumes:
      - media_data:/app/media:ro
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - livekit
      - centrifugo
      - mock_store
    networks:
      - voice_net

  sip:
    image: livekit/sip:latest
    container_name: voice_sip
    restart: unless-stopped
    environment:
      SIP_CONFIG_BODY: |
        api_key: devkey
        api_secret: secretkey1234567890abcdef
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        sip_port: 5060
        rtp_port: 10000-10030
        nat_1_to_1_ip: ${EXTERNAL_IP:-127.0.0.1}
        use_external_ip: false
        logging:
          level: info
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10030:10000-10030/udp"
    depends_on:
      - livekit
      - redis
    networks:
      - voice_net


volumes:
  pgdata:
  media_data:

networks:
  voice_net:
    driver: bridge
